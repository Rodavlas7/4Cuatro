{% load static %}

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TraceX API — Iniciar sesión</title>

<link rel="stylesheet" href="{% static 'css/styles.css' %}">

<style>
  .login-error{
    margin: 0 0 16px;
    padding: 11px 14px;
    border-radius: 10px;
    background: rgba(239,68,68,0.12);
    border: 1px solid rgba(239,68,68,0.35);
    color: #FCA5A5;
    font-size: 13px;
    text-align: center;
  }
</style>
</head>

<body>

<div class="card">

    <div class="logo-wrap">
        <img src="{% static 'img/tracex-logo.png' %}" alt="Trace X">
    </div>

    <h1>Trace X</h1>
    <p class="subtitle">Inicia sesión para explorar la API</p>

    {% if error %}
    <div class="login-error">{{ error }}</div>
    {% endif %}

    <form method="POST">

        {% csrf_token %}

        <div class="field">
            <input type="text" name="usuario" placeholder="Usuario" required autofocus>
            <span class="dot"></span>
        </div>

        <div class="field">
            <input type="password" name="contrasena" placeholder="Contraseña" id="pw" required>
            <button type="button" class="eye" onclick="togglePw()"> 👁</button>
            <span class="dot"></span>
        </div>

        <button class="btn-primary" type="submit">Iniciar Sesión</button>

    </form>
</div>


<script>
function togglePw(){
    const pw = document.getElementById('pw');
    pw.type = pw.type === 'password'
        ? 'text'
        : 'password';
}
</script>

</body>
</html>
