{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mantenimiento - TraceX</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- Archivo CSS Global de TraceX -->
    <link rel="stylesheet" href="{% static 'css/global.css' %}">
    
    <style>
        body {
            /* Forzamos el color de fondo definido en tus variables */
            background-color: var(--color-bg) !important;
        }
        .maintenance-wrapper {
            max-width: 500px;
            width: 100%;
        }
        .spin-slow {
            font-size: 5rem;
            color: var(--color-warning);
            animation: spin 4s linear infinite;
            display: inline-block;
        }
        @keyframes spin {
            100% { transform: rotate(360deg); }
        }
        .logo-tracex {
            height: 65px;
            object-fit: contain;
        }
        
        /* Botón estilo outline usando tus variables */
        .btn-white {
            background-color: var(--color-white);
            color: var(--color-text);
            border: 1px solid var(--color-border);
            font-weight: 500;
            transition: var(--transition);
        }
        .btn-white:hover {
            background-color: var(--color-bg);
            color: var(--color-text);
        }
    </style>
</head>
<body class="min-vh-100 d-flex align-items-center justify-content-center p-3">

    <div class="maintenance-wrapper text-center">
        <!-- Contenedor usando tu clase personalizada -->
        <div class="emp-card p-5 mb-4">
            
            <!-- Logo TraceX adjunto -->
            <img src="{% static 'img/logo.svg' %}" alt="TraceX Logo" class="logo-tracex mb-4">
            
            <div class="mb-3">
                <i class="bi bi-gear-wide-connected spin-slow"></i>
            </div>
            
            <h1 class="fw-bold mb-3 h4" style="color: var(--color-text);">Mantenimiento Pogramado.</h1>
            <p class="mb-4" style="color: var(--color-text-light);">
                Esta opción se encuentra temporalmente fuera de servicio debido a un manterimiento programado. El servicio estará operativo nuevamente en breve. Intente más tarde.
            </p>
            
            <!-- Botón secundario con historia del navegador -->
            <button onclick="history.back()" class="btn btn-white d-inline-flex align-items-center gap-2 px-4 py-2">
                <i class="bi bi-arrow-left"></i> Regresar a la página anterior
            </button>
        </div>
    </div>

</body>
</html>
