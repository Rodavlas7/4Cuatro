{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página no encontrada - TraceX</title>
    <link rel="icon" type="image/png" href="{% static 'img/favicon.png' %}">
    
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- Archivo CSS Global de TraceX -->
    <link rel="stylesheet" href="{% static 'css/global.css' %}">
    
    <style>
        /* Bloqueamos el scroll y aplicamos el color de fondo de tu tema */
        body, html {
            background-color: var(--color-bg, #f4f7f9) !important;
            margin: 0;
            padding: 0;
            height: 100vh;
            overflow: hidden;
        }
        
        .error-card {
            max-width: 650px;
            border-radius: 20px;
        }
        
        /* Ajuste para el logo que adjuntaste */
        .logo-tracex {
            height: 55px;
            object-fit: contain;
        }
        
        /* Tipografía gigante y elegante para el 404 */
        .error-code {
            font-size: 8rem;
            font-weight: 900;
            color: #1a2b4c; /* Azul oscuro corporativo */
            line-height: 1;
            letter-spacing: -2px;
            text-shadow: 4px 4px 0px rgba(26, 43, 76, 0.05);
        }
        
        /* Animación suave para el ícono de búsqueda */
        .floating-icon {
            animation: float 4s ease-in-out infinite;
        }
        @keyframes float {
            0% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-15px) rotate(5deg); }
            100% { transform: translateY(0px) rotate(0deg); }
        }
        
        .linea-decorativa {
            height: 4px; 
            width: 50px; 
            border-radius: 2px;
        }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center">

    <div class="container-fluid d-flex justify-content-center p-0 m-0">
        <!-- Tarjeta principal heredando tus estilos globales -->
        <div class="card shadow-lg border-0 bg-white p-5 text-center error-card w-100 mx-3 emp-card">
            
            <!-- Composición Visual 404 -->
            <div class="position-relative d-inline-block mx-auto mb-2 mt-3">
                <div class="error-code">404</div>
                
                <!-- Lupa flotante animada que da la idea de "búsqueda fallida" -->
                <div class="position-absolute floating-icon" style="top: -15px; right: -40px;">
                    <i class="bi bi-search text-primary" style="font-size: 3.5rem;"></i>
                </div>
            </div>

            <!-- Título amigable pero profesional -->
            <h2 class="fw-bold mb-3 h3" style="color: var(--color-text, #1a2b4c);">Houston, tenemos un problema... </h2>
            
            <!-- Línea decorativa -->
            <div class="bg-primary mx-auto mb-4 linea-decorativa"></div>
            
            <!-- Texto descriptivo -->
            <p class="mb-5 fs-5 lh-base px-md-4" style="color: var(--color-text-light, #6c757d);">
                La página que intentas buscar parece haber sido movida, eliminada o simplemente no existe en nuestro sistema.
            </p>
            
            <!-- Botones de Acción (Usando Grid para responsive) -->
            <div class="d-flex flex-column flex-sm-row justify-content-center gap-3 mt-2">
                <!-- Botón secundario -->
                <button onclick="history.back()" class="btn btn-outline-secondary px-4 py-2 rounded-3 fw-medium text-dark shadow-sm" style="border-color: #dce1e6;">
                    <i class="bi bi-arrow-left me-2"></i> Regresar
                </button>
                <!-- Botón primario (Utiliza tu clase btn-accent si está en global.css) -->
                <a href="/" class="btn btn-primary btn-accent px-4 py-2 rounded-3 fw-medium shadow-sm">
                    <i class="bi bi-house-door me-2"></i> Ir al Inicio
                </a>
            </div>
            
        </div>
    </div>

</body>
</html>
