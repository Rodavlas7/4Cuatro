{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error 404 - TraceX</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- Archivo CSS Global de TraceX -->
    <link rel="stylesheet" href="{% static 'css/global.css' %}">
    
    <style>
        body {
            /* Forzamos el color de fondo definido en tus variables */
            background-color: var(--color-bg) !important;
        }
        .error-wrapper {
            max-width: 500px;
            width: 100%;
        }
        .floating-icon {
            font-size: 5rem;
            color: var(--color-danger);
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
        .logo-tracex {
            height: 65px;
            object-fit: contain;
        }
    </style>
</head>
<body class="min-vh-100 d-flex align-items-center justify-content-center p-3">

    <div class="error-wrapper text-center">
        <!-- Contenedor usando tu clase personalizada -->
        <div class="emp-card p-5 mb-4">
            
            <!-- Logo TraceX adjunto -->
            <img src="{% static 'img/logo.svg' %}" alt="TraceX Logo" class="logo-tracex mb-4">
            
            <div class="floating-icon mb-3">
                <i class="bi bi-motherboard"></i>
            </div>
            
            <h1 class="fw-bold mb-3 h4" style="color: var(--color-text);">Houston, tenemos un problema... (ERROR 404)</h1>
            <p class="mb-4" style="color: var(--color-text-light);">
                La pagina solicitada no se encuentra disponible. Parece que el enlace está roto o la dirección ha cambiado.</p>
            
            <!-- Botón primario de tu CSS global -->
            <a href="/" class="btn btn-accent d-inline-flex align-items-center gap-2 px-4 py-2">
                <i class="bi bi-house-door"></i> Volver al inicio
            </a>
            <button onclick="history.back()" class="btn btn-white d-inline-flex align-items-center gap-2 px-4 py-2">
                <i class="bi bi-arrow-left"></i> Regresar a la página anterior
            </button>
        </div>
    </div>

</body>
</html>
